plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // DimLib 26.3 port is published here by `gradlew publishToMavenLocal` in ../DimLib
    mavenLocal()

    // cloth config
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/imm_ptl.accesswidener")
}

// TODO(26.3): Sodium/Iris/Gravity Changer compat is not ported yet.
// These files reference those mods directly and are left out until then.
sourceSets.main.java {
    exclude 'qouteall/imm_ptl/core/compat/mixin/iris/**'
    exclude 'qouteall/imm_ptl/core/compat/mixin/sodium/**'
    exclude 'qouteall/imm_ptl/core/compat/mixin/flywheel/**'
    exclude 'qouteall/imm_ptl/core/compat/mixin/cardinal_comp/**'
    exclude 'qouteall/imm_ptl/core/compat/iris_compatibility/ExperimentalIrisPortalRenderer.java'
    exclude 'qouteall/imm_ptl/core/compat/iris_compatibility/IrisPortalRenderer.java'
    exclude 'qouteall/imm_ptl/core/compat/iris_compatibility/IrisCompatibilityPortalRenderer.java'
    exclude 'qouteall/imm_ptl/core/compat/iris_compatibility/OnIrisPresent.java'
    exclude 'qouteall/imm_ptl/core/compat/sodium_compatibility/OnSodiumPresent.java'
    exclude 'qouteall/imm_ptl/core/compat/sodium_compatibility/SodiumRenderingContext.java'
    // only implemented by the (excluded) Sodium mixins, and its signature uses SodiumRenderingContext
    exclude 'qouteall/imm_ptl/core/compat/sodium_compatibility/IESodiumRenderSectionManager.java'
    exclude 'qouteall/imm_ptl/core/compat/OnGravityChangerPresent.java'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") {
        exclude module: "fabric-gametest-api-v1"
        // for now, the gametest module makes client unable to login dev env server
    }

    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    compileOnly "maven.modrinth:modmenu:${modmenu_version}"
    localRuntime "maven.modrinth:modmenu:${modmenu_version}"

    api("qouteall.dimlib:dimlib:${dimlib_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include("qouteall.dimlib:dimlib:${dimlib_version}")

    testImplementation(platform('org.junit:junit-bom:5.10.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')
}

processResources {
    def props = ["version": project.version, "github_repo": project.github_repo]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs += ["-Xmaxerrs", "10000"]
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def archivesName = project.base.archivesName.get()
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-fabric.jar"
    from("LICENSE") {
        rename { "${it}_${archivesName}"}
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
