plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // DimLib 26.3 port is published here by `gradlew publishToMavenLocal` in ../DimLib
    mavenLocal()

    // cloth config
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }

    // only ask Modrinth for Modrinth artifacts (and nobody else)
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/imm_ptl.accesswidener")
}

// Visual test harness (Fabric client gametest): ./gradlew runClientGameTest [-PipBackend=opengl|vulkan]
// Screenshots of portals from fixed camera poses go to build/visual-test/<backend>/
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "immersive_portals_gametest"
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = true
    }
}
def ipBackend = providers.gradleProperty("ipBackend").getOrElse("opengl")
loom {
    runs {
        clientGameTest {
            programArgs "--graphicsBackend", ipBackend, "--width", "1280", "--height", "720"
            // -PwithShaders: Iris with the test shaderpack (src/gametest/resources/immptl_test_shaderpack)
            property "imm_ptl.visualTest.shaders", providers.gradleProperty("withShaders").isPresent().toString()
            property "imm_ptl.visualTest.out", file("build/visual-test/" + ipBackend + (providers.gradleProperty("withShaders").isPresent() ? "-shaders" : providers.gradleProperty("withIris").isPresent() ? "-iris" : providers.gradleProperty("withSodium").isPresent() ? "-sodium" : "")).absolutePath
        }
    }
}

// TODO(26.3): Iris/Gravity Changer compat is not ported yet.
// These files reference those mods directly and are left out until then.
sourceSets.main.java {
    exclude 'qouteall/imm_ptl/core/compat/mixin/flywheel/**'
    exclude 'qouteall/imm_ptl/core/compat/mixin/cardinal_comp/**'
    exclude 'qouteall/imm_ptl/core/compat/iris_compatibility/ExperimentalIrisPortalRenderer.java'
    exclude 'qouteall/imm_ptl/core/compat/iris_compatibility/IrisPortalRenderer.java'
    exclude 'qouteall/imm_ptl/core/compat/iris_compatibility/IrisCompatibilityPortalRenderer.java'
    exclude 'qouteall/imm_ptl/core/compat/iris_compatibility/OnIrisPresent.java'
    exclude 'qouteall/imm_ptl/core/compat/OnGravityChangerPresent.java'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") {
        exclude module: "fabric-gametest-api-v1"
        // for now, the gametest module makes client unable to login dev env server
    }

    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    compileOnly "maven.modrinth:modmenu:${modmenu_version}"
    localRuntime "maven.modrinth:modmenu:${modmenu_version}"

    // Sodium compatibility: compiled against; in dev, run with it via -PwithSodium
    compileOnly "maven.modrinth:sodium:${sodium_version}"
    compileOnly "maven.modrinth:iris:${iris_version}"
    gametestCompileOnly "maven.modrinth:iris:${iris_version}"
    if (providers.gradleProperty("withSodium").isPresent() || providers.gradleProperty("withIris").isPresent() || providers.gradleProperty("withShaders").isPresent()) {
        localRuntime "maven.modrinth:sodium:${sodium_version}"
    }
    // Iris compatibility: in dev, run with it via -PwithIris (implies Sodium)
    if (providers.gradleProperty("withIris").isPresent() || providers.gradleProperty("withShaders").isPresent()) {
        localRuntime "maven.modrinth:iris:${iris_version}"
    }

    api("qouteall.dimlib:dimlib:${dimlib_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include("qouteall.dimlib:dimlib:${dimlib_version}")

    testImplementation(platform('org.junit:junit-bom:5.10.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

processResources {
    def props = ["version": project.version, "github_repo": project.github_repo]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs += ["-Xmaxerrs", "10000"]
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def archivesName = project.base.archivesName.get()
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-fabric.jar"
    from("LICENSE") {
        rename { "${it}_${archivesName}"}
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

// unit tests (the visual test is runClientGameTest)
test {
    useJUnitPlatform()
}
